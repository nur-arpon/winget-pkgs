ShortDescription: Hold Space and tap a letter to open, switch to or minimise any app.
Description: |-
  Spaceadom turns your spacebar into an app launcher. Hold Space and tap a letter, and that app opens; tap again and it minimises. Space on its own still types a space.
  Hold the middle mouse button for a ring of your apps under the cursor, and slide along a touchpad edge for brightness, volume and video seeking (external monitors included).
